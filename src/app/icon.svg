<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Saleslights">
  <!-- Authored as SVG rather than cut from logo-light.png on purpose: a favicon
       is drawn at 16px, and the real mark is a bulb wrapped in gear teeth that
       turns to mush at that size. This keeps the brand's two colours and the
       bulb silhouette, and stays crisp at every size a browser asks for. -->
  <rect width="64" height="64" rx="14" fill="#0a1d3d"/>
  <!-- bulb -->
  <path d="M32 13c-8.3 0-15 6.5-15 14.5 0 5.4 2.9 9.4 5.6 12.2 1.4 1.5 2.4 3 2.4 4.8V46h14v-1.5c0-1.8 1-3.3 2.4-4.8C44.1 36.9 47 32.9 47 27.5 47 19.5 40.3 13 32 13Z" fill="#f5821f"/>
  <!-- filament -->
  <path d="M27 27.5 32 34l5-6.5" fill="none" stroke="#0a1d3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- base -->
  <rect x="26" y="49" width="12" height="4" rx="2" fill="#f5821f"/>
</svg>
